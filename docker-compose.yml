# Janamdatri-AI · full stack (web app + API + workers + database + SMS inbox), cloud AI by default
#
#   cp .env.example .env          # add your AI keys (GEMINI_API_KEY, GROQ_API_KEY, AZURE_SPEECH_KEY …)
#   docker compose up -d --build
#   open http://localhost:8000      (SMS inbox with OTPs: http://localhost:8025)
#
# Optional extras (combine with -f):
#   docker-compose.local-ai.yml   local models on this machine (Ollama, Whisper, PaddleOCR, Coqui) – offline mode
#   docker-compose.prod.yml       public server (Azure VM): HTTPS with Caddy, password-protected SMS inbox
#
# One image for api, worker and beat: built once by the api service and shared.
x-app: &app
  image: janamdatri-ai-app:latest
  pull_policy: never
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://janamdatri:${POSTGRES_PASSWORD:-janamdatri}@db:5432/janamdatri
    REDIS_URL: redis://redis:6379/0
    CELERY_ENABLED: "true"
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
  volumes:
    - media:/app/media
  restart: unless-stopped

services:
  api:
    <<: *app
    build: {context: ., dockerfile: backend/Dockerfile}
    pull_policy: build
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker -l info --concurrency 2
    depends_on: [api]

  beat:
    <<: *app
    command: celery -A app.workers.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    depends_on: [api]

  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: janamdatri, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-janamdatri}", POSTGRES_DB: janamdatri}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U janamdatri"], interval: 5s, retries: 10}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10}
    restart: unless-stopped

  # Inbox for every SMS (OTPs, alerts): http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
