# Optional: run the AI models on this machine too (offline mode). Needs ~16 GB RAM and ~15 GB of downloads.
#   docker compose -f docker-compose.yml -f docker-compose.local-ai.yml up -d --build
# Cloud keys in .env are still used first; these models are the backup (set LLM_PROVIDER=ollama for local only).
x-models: &models
  - speech-models:/home/app/.cache
  - ocr-models:/home/app/.paddleocr
  - voice-models:/home/app/.local/share/tts
  - media:/app/media

services:
  api:
    build: {args: {INSTALL_AI: "true"}}
    environment: &local-env
      LLM_BASE_URL: http://ollama:11434
      COQUI_TOS_AGREED: "${COQUI_TOS_AGREED:-1}"  # XTTS v2 voice: Coqui Public Model License (non-commercial)
    volumes: *models
    depends_on:
      models: {condition: service_completed_successfully}
  worker:
    environment: *local-env
    volumes: *models
  beat:
    environment: *local-env

  # One-off: download Whisper, PaddleOCR and Coqui voice models into volumes.
  models:
    image: janamdatri-ai-app:latest
    pull_policy: never
    env_file: .env
    environment: *local-env
    volumes: *models
    command: python -m scripts.download_models
    depends_on: []
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

  # One-off: pull the local models named in .env.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["sh", "-c", "sleep 3 && for m in ${LLM_MODEL:-llama3.1:8b} ${LLM_SECONDARY_MODEL-} ${EMBEDDING_OLLAMA_MODEL:-nomic-embed-text}; do echo \"pulling $$m\"; ollama pull $$m || echo \"could not pull $$m\"; done"]
    environment: {OLLAMA_HOST: "ollama:11434"}
    depends_on: [ollama]
    restart: "no"

volumes:
  ollama:
  speech-models:
  ocr-models:
  voice-models:
